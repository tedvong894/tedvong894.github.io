<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生产经营分析系统</title>
<script>
(function(){
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(rs){
        rs.forEach(function(r){ try{ if (r.scope === location.origin + '/') r.unregister(); }catch(e){} });
      }).catch(function(){});
    }
  } catch(e){}
  location.replace('/production-analysis/');
})();
</script>
</head>
<body style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;padding:40px;color:#333">
正在打开「生产经营分析系统」…<br><br><a href="/production-analysis/">若未自动跳转，点此进入</a>
</body>
</html>
